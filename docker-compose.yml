services:
  backend:
    build:
      context: ./backend
      args:
        DB_TYPE: ${DB_TYPE}
    env_file: .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/memory.md:/app/memory.md

  frontend:
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_DB_NAME: ${DB_NAME}
    ports:
      - "5173:80"
    depends_on:
      - backend
